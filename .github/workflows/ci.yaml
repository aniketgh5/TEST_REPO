name: CI PIPELINE



on:
  push:
    branches: [ main, develop ]
jobs:
  build-and-test:
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
